system:
  name: Weather Station Local Server
  location: Your Location
  timezone: Asia/Jakarta
database:
  path: ./data/weatherstation.db
  backup_enabled: true
  backup_interval: 86400
  auto_cleanup_enabled: true
  auto_cleanup_days: 1
mqtt:
  protocol: tcp
  broker_url: mqtt://emqx.prasenaenergy.com:1883
  broker_host: emqx.prasenaenergy.com
  broker_port: 1883
  username: prasena
  password: emqxoversecurewebsocket
  qos: 1
  clean_session: true
  keepalive: 60
  reconnect_delay: 5
  # client_id: gateway_location_A  # Optional: Override auto-generated client ID
                                    # If not set, uses hostname: gateway_{hostname}
                                    # Example: gateway_weatherstation1, gateway_weatherstation2
  publisher:
    poll_interval: 5
    batch_size: 10
  topics:
    sensor_data: prasena/sensors
    weather_data: prasena/sensors/weather
    battery_data: prasena/sensors/battery
    system_status: prasena/system/status
    control: prasena/control/#
battery_sensors:
  enabled: true
  poll_interval: 1
  sampling_rate: 1
  aggregation_window: 60
weather_station:
  enabled: true
  http_port: 5001
  protocol: ecowitt
  # sensor_id now comes from database (register via web admin)
upload:
  enabled: false
  interval: 60
  batch_size: 100
  max_retry: 5
  retry_interval: 30
  main_server_url: http://your-main-server.com/api/data
  api_key: your_api_key_here
  timeout: 30
api:
  enabled: true
  host: 0.0.0.0
  port: 5000
  debug: false
  cors_enabled: true
  cors_origins:
  - '*'
web_admin:
  enabled: false
  host: 0.0.0.0
  port: 8080
  debug: false
logging:
  level: INFO
  log_to_file: true
  log_file: ./logs/system.log
  weather_log_file: ./logs/weather_receiver.log
  mqtt_log_file: ./logs/mqtt_publisher.log
  max_file_size: 10485760
  backup_count: 5
discovery:
  enabled: false
  scan_interval: 3600
  pzem_address_range:
  - 1
  - 20
